<html>
<head>
<title>Geosphere Test</title>
<style>
	body {
		font-family:sans-serif;
	}

	
</style>
</head>
    <body>
<h1>Geosphere Graph</h1>
<p>This project fetches data of one station from <a href="https://www.geosphere.at/de">Geosphere Austria</a> and displays it using <a href="https://observablehq.com/plot/">ObservableHQ Plot</a>
<p>Visit <a href="https://github.com/luke-ff/GeosphereGraph">https://github.com/luke-ff/GeosphereGraph</a> for details</p>
<p>This is live Data from Mattsee, Austria</p>
<hr>
        <div id="container"></div>



<script type="module">
	/* Diesen Link verwenden, wenn das Script nicht lokal gespeichert werden soll */
	import {GeosphereGraph} from 'https://cdn.jsdelivr.net/gh/luke-ff/GeosphereGraph/geosphere.js';
	/* Lokale Version verwenden */
	// import {GeosphereGraph} from './geosphere.js';

    GeosphereGraph.run(
        document.getElementById("container"), 
        { 
            station: 11152,
            range: 12,
            plots: GeosphereGraph.LT + GeosphereGraph.FF + GeosphereGraph.DD + GeosphereGraph.FD + GeosphereGraph.P, 
            plotsettings: {
				width:700,
				height:200,
				inset:10,
                style: {
					width:"auto",
					minWidth:"100%",
					fontSize:"9px"
				}
            } 
        }
    );
    
</script>	

        
    </body>
</html>
