<html>
<head>
<title>Geosphere Test</title>
<style>
	body {
		font-family:sans-serif;
	}

	
</style>
</head>
    <body>
<h1>Mattsee</h1>
        <div id="container"></div>



<script type="module">
	/* Diesen Link verwenden, wenn das Script nicht lokal gespeichert werden soll */
	import {GeosphereGraph} from 'https://cdn.jsdelivr.net/gh/luke-ff/GeosphereGraph/geosphere.js';
	/* Lokale Version verwenden */
	// import {GeosphereGraph} from './geosphere.js';

    GeosphereGraph.run(
        document.getElementById("container"), 
        { 
            station: 11152,
            range: 6,
            plots: GeosphereGraph.FF + GeosphereGraph.DD + GeosphereGraph.FD + GeosphereGraph.P, 
            plotsettings: {
				width:700,
				height:200,
				inset:10,
                style: {
					width:"auto",
					minWidth:"100%",
					fontSize:"9px"
				}
            } 
        }
    );
    
</script>	

        
    </body>
</html>
